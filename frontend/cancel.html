<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Appointment</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #f9fafb; }
      #app { max-width: 40rem; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 16px; font-size: 1.5rem; color: #111; }
      #card { background: white; border-radius: 8px; padding: 24px;
              box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
      #cb-status { margin: 0; font-size: 1.1rem; }
      #cb-error { margin: 12px 0 0; color: #dc2626; font-size: 0.9rem; }
      #cb-cancel { margin-top: 20px; padding: 8px 16px; font-size: 1rem; cursor: pointer;
                   border: 1px solid #d1d5db; border-radius: 4px; background: white; }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Your appointment</h1>
      <div id="card">
        <p id="cb-status">Looking up your booking…</p>
        <p id="cb-error" hidden></p>
        <!-- Never cancelled by the mere act of opening the link: a mail
             scanner that follows it must find a button, not a cancellation. -->
        <button id="cb-cancel" hidden>Cancel this booking</button>
      </div>
    </div>
    <script type="module" src="/src/cancel.ts"></script>
  </body>
</html>
