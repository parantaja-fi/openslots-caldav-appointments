name: Release

# A release is cut by pushing a SEMVER tag:
#
#   git tag -a v0.1.0 -m "the release notes"
#   git push origin v0.1.0
#
# The release's notes are the tag's annotation when it has one, and
# GitHub-generated from the commit history otherwise. A pre-release
# tag (v0.2.0-rc.1) becomes a pre-release. No third-party action: the
# runner's own `gh` does the one call.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # checkout replaces the annotated tag with a lightweight one
          # (actions/checkout#290); restore the annotation first.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          set -- --verify-tag --title "$TAG"
          case "$TAG" in *-*) set -- "$@" --prerelease ;; esac
          if [ -n "$notes" ]; then
            gh release create "$TAG" "$@" --notes "$notes"
          else
            gh release create "$TAG" "$@" --generate-notes
          fi
