name: CI

# Builds both halves. The spike's production build was silently broken for
# months because only `vite dev` was ever run; that must not recur.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a breakage nobody pushed into — a revoked key, a DNS change —
  # still surfaces. Only the email round trip needs this; the rest come along.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # No backend needed; the live suite is the two jobs below.
      - run: npm test -- --project unit

  # The live suite against a CalDAV server this job builds itself, so it needs
  # no secret and runs on pull requests from forks.
  live-radicale:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/radicale
      - run: npm test -- --project live:radicale

  # The credentialed backends. Gated so that a fork's pull request never sees a
  # secret, and serialised per backend because every live file shares one
  # window in one calendar pair.
  live-remote:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { backend: nextcloud, secret: BACKEND_NEXTCLOUD }
          - { backend: google, secret: BACKEND_GOOGLE }
    concurrency:
      group: live-remote-${{ matrix.backend }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # The secret is the profile, byte for byte, as written by
      # `gh secret set BACKEND_<NAME> < worker/test/backends/<name>.vars`.
      - name: Write the profile
        run: printf '%s' "$PROFILE" > "test/backends/${{ matrix.backend }}.vars"
        env:
          PROFILE: ${{ secrets[matrix.secret] }}
      - run: npm test -- --project live:${{ matrix.backend }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  wizard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wizard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wizard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The email path end to end, and the only job that sends real mail. It needs
  # every other job first: each run spends two messages of a small monthly
  # receive quota, so it is not worth spending on a commit already known bad.
  # Never on pull requests — the secrets are unavailable to forks anyway, and
  # mail latency makes a poor per-commit gate.
  email-roundtrip:
    if: github.event_name != 'pull_request'
    needs: [worker, live-radicale, live-remote, frontend, wizard]
    runs-on: ubuntu-latest
    # One run at a time: the inbox is shared, and two runs in the same window
    # would match each other's messages.
    concurrency:
      group: email-roundtrip
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/radicale
      # What `wrangler dev` reads: the loopback backend, a throwaway signing key,
      # and the CI Brevo key — a third key, revocable without touching local
      # testing or production.
      - name: Write .dev.vars
        run: |
          cat test/backends/radicale.vars > .dev.vars
          printf "SIGNING_KEY_JWK = '%s'\n" "$(node scripts/keygen.mjs)" >> .dev.vars
          printf 'BREVO_API_KEY = "%s"\n' "$BREVO_API_KEY" >> .dev.vars
          printf 'PRACTITIONER_EMAIL = "ci-notice@parantaja.fi"\n' >> .dev.vars
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_CI_API_KEY }}
      - name: Start the Worker
        run: |
          npx wrangler dev --port 8787 &
          # Without parameters the route answers 400, which is answer enough.
          timeout 120 bash -c \
            'until curl -s -o /dev/null http://localhost:8787/v1/slots; do sleep 1; done'
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm run roundtrip
        env:
          TESTMAIL_APIKEY: ${{ secrets.TESTMAIL_APIKEY }}
          TESTMAIL_NAMESPACE: ${{ secrets.TESTMAIL_NAMESPACE }}
          # The same address written as PRACTITIONER_EMAIL above, which is what
          # tells the script the notice is observable.
          ROUNDTRIP_NOTICE_RECIPIENT: ci-notice@parantaja.fi
