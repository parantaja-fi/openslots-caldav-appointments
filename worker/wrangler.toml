name = "booking-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Operational configuration. Credentials and keys are secrets, never vars:
#   AVAILABILITY_USERNAME / AVAILABILITY_PASSWORD   CalDAV Basic auth, read-only role
#   BOOKING_STORE_USERNAME / BOOKING_STORE_PASSWORD CalDAV Basic auth, read/write role
#   GOOGLE_SERVICE_ACCOUNT_JSON                     used for a role that has no username
#   SIGNING_KEY_JWK                                 private P-256 JWK, `npm run keygen`
#   BREVO_API_KEY                                   transactional API key; unset sends no mail
[vars]
# Pointing both at the same calendar is the single-calendar setup.
AVAILABILITY_CALENDAR_URL = "http://localhost:5232/booking/availability-test/"
BOOKING_STORE_URL         = "http://localhost:5232/booking/bookings-test/"

SLOT_MINUTES         = "30"
BOOKING_HORIZON_DAYS = "60"
MIN_NOTICE_MINUTES   = "120"
MAX_SLOTS            = "500"

GRANT_TTL_SECS     = "1800"
PROOF_MAX_AGE_SECS = "60"

ALLOWED_ORIGINS = "http://localhost:5173"

# The practitioner's zone. All-day calendar entries, and any without a zone of
# their own, are read in it; the email writes appointment times in it.
DISPLAY_TIMEZONE = "Europe/Helsinki"

# The confirmation email. Read only when BREVO_API_KEY is set, and then both
# must be usable: the page the cancellation link points at, and a sender address
# whose domain carries your SPF and DKIM records. PRACTITIONER_EMAIL, if set,
# also gets a notice.
CANCEL_URL   = "http://localhost:5173/cancel.html"
SENDER_EMAIL = "info@parantaja.fi"
SENDER_NAME  = "Parantaja"
# PRACTITIONER_EMAIL = "info@parantaja.fi"

# Per-IP limit on every request, checked before routing. Unbound under
# `wrangler dev`, hence optional in the code; the test pool does enforce it, so
# vitest.config.ts raises the limit for the suites.
[[ratelimits]]
name         = "BOOKING_RL"
namespace_id = "1"
simple       = { limit = 20, period = 60 }
